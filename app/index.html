
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My DevOps Project</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #e0e7ff);
            color: #1f2937;
            text-align: center;
        }

        .card {
            background: white;
            max-width: 800px;
            margin: 20px auto;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            color: #1456a0;
            margin-bottom: 20px;
        }

        p {
            font-size: 17px;
            line-height: 1.7;
        }

        .banner {
            display: block;
            width: 100%;
            max-width: 600px;
            height: auto;
            margin: 25px auto;
            border-radius: 12px;
        }

        .badge {
            display: inline-block;
            background: #e0f2fe;
            color: #075985;
            padding: 10px 16px;
            margin: 6px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        footer {
            margin-top: 25px;
            color: #64748b;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>My Automated Docker Deployment</h1>

        <p>
            Hello! Welcome to my DevOps project.
            My application is running inside a Docker container Argo CD.
        </p>

        <p>
            Built and deployed using Jenkins CI/CD.
        </p>

        <img
            src="banner.png"
            alt="My DevOps Project Banner"
            class="banner"
        >

        <h2>Technologies Used</h2>

        <span class="badge">Docker</span>
        <span class="badge">Jenkins</span>
        <span class="badge">Terraform</span>
        <span class="badge">CI/CD</span>

        <p>
            Project: Terraform + Docker + Jenkins
        </p>

        <footer>
            My DevOps Learning Journey | 2026
        </footer>

    </div>

</body>
</html>
